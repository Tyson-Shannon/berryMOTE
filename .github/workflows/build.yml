name: Build

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: berryMOTE-windows-x64
            executable: dist/berryMOTE.exe
            checksum: dist/berryMOTE.exe.sha256
          - name: Linux x64
            os: ubuntu-22.04
            artifact: berryMOTE-linux-x64
            executable: dist/berryMOTE
            checksum: dist/berryMOTE.sha256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build single-file executable
        run: python scripts/build.py

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 120 ./dist/berryMOTE --self-test

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "dist\berryMOTE.exe" -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Self-test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($process.ExitCode)"
          }

      - name: Generate checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          target = next(
              path
              for path in (Path("dist/berryMOTE.exe"), Path("dist/berryMOTE"))
              if path.is_file()
          )
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          checksum = target.with_name(target.name + ".sha256")
          checksum.write_text(f"{digest}  {target.name}\n", encoding="ascii")
          print(f"{target}: {digest}")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.executable }}
            ${{ matrix.checksum }}
            THIRD_PARTY_NOTICES.md
            LICENSES/LGPL-3.0.txt
            LICENSE

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.executable }}
            ${{ matrix.checksum }}
            THIRD_PARTY_NOTICES.md
            LICENSES/LGPL-3.0.txt
            LICENSE
