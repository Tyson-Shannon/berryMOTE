<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#5E17EB">
    <link rel="icon" href="/static/berryLogo.png" type="image/png">
    <title>berryMOTE Login</title>
    <style>
        :root { --accent: #5E17EB; --bg: #121016; --card: #1c1922; --text: #f5f2fb; --muted: #a49bb8; --danger: #ff6b6b; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: radial-gradient(circle at 50% 0%, #2a1648 0%, var(--bg) 55%);
            color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 340px; background: var(--card);
            border: 1px solid #312a3e; border-radius: 18px; padding: 24px;
            text-align: center;
        }
        img { width: 54px; height: 54px; border-radius: 14px; }
        h1 { font-size: 23px; margin: 12px 0 6px; }
        p { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 20px; }
        input {
            width: 100%; border-radius: 11px; border: 1px solid #443a55;
            background: #100d15; color: var(--text); padding: 15px;
            font-size: 20px; text-align: center; letter-spacing: 5px;
            outline: none; margin-bottom: 12px;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%; border: 0; border-radius: 11px; background: var(--accent);
            color: white; padding: 14px; font-size: 15px; font-weight: 700;
            font-family: inherit; cursor: pointer;
        }
        button:active { background: #4810b8; }
        .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 10px; }
        a { color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/static/berryLogo.png" alt="">
        <h1>berryMOTE</h1>
        {% if pin_required %}
        <p>Enter the PIN for this berryMOTE remote.</p>
        <form method="post" action="/login">
            <input name="pin" type="password" inputmode="text" autocomplete="off"
                   autocapitalize="off" autocorrect="off" spellcheck="false"
                   maxlength="32" autofocus required placeholder="PIN">
            <div class="error">{{ error }}</div>
            <button type="submit">Unlock Remote</button>
        </form>
        {% else %}
        <p>A PIN is not enabled for this remote.</p>
        <p><a href="/">Open the remote</a></p>
        {% endif %}
    </main>
</body>
</html>
