<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/static/berryLogo.png" type="image/png">
    <title>berryMOTE</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin: 0 0 16px;
        }
        h3 {
            margin: 0 0 8px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            background-color: #5E17EB;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: rgb(82, 17, 212);
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .button-row button {
            flex: 1;
        }
        .volume-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .volume-row button {
            flex: 1;
        }
        .sensitivity-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #555;
            font-size: 14px;
        }
        .sensitivity-row input {
            flex: 1;
            accent-color: #5E17EB;
        }
        #trackpad {
            width: 100%;
            height: 200px;
            background: #eee;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin-bottom: 10px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
        }
        #trackpad:active {
            cursor: grabbing;
        }
        #keystroke-catcher {
            border: 1px solid #ccc;
            padding: 10px;
            height: 50px;
            box-sizing: border-box;
            width: 100%;
            font-size: 16px;
            outline: none;
            margin-top: 10px;
            text-align: left;
            color: transparent;
            caret-color: transparent;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            text-shadow: none;
        }
        #keystroke-catcher::placeholder {
            color: #999;
            -webkit-text-fill-color: #999;
        }
        #keystroke-catcher::selection {
            background: transparent;
            color: transparent;
        }
        .lock {
            display: block;
            margin-top: 14px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>berryMOTE</h2>
        <div class="sensitivity-row">
            <label for="sensitivity">Sensitivity</label>
            <input id="sensitivity" type="range" min="0.5" max="2.5" step="0.1" value="1.2">
        </div>
        <div id="trackpad">Drag to move &middot; tap to click &middot; long press to right click</div>
        <div class="button-row">
            <button data-click="left">Left Click</button>
            <button data-click="right">Right Click</button>
        </div>
        <button data-scroll="2">Scroll Up</button>
        <button data-scroll="-2">Scroll Down</button>
        <div class="volume-row">
            <button data-action="volume_down">🔉</button>
            <button data-action="volume_toggle_mute">🔇</button>
            <button data-action="volume_up">🔊</button>
        </div>
        <input id="keystroke-catcher" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Tap here and start typing...">
        {% if pin_required %}<a class="lock" href="/logout">Lock remote</a>{% endif %}
    </div>

    <script>
        "use strict";

        const trackpad = document.getElementById("trackpad");
        const catcher = document.getElementById("keystroke-catcher");
        const sensitivity = document.getElementById("sensitivity");

        sensitivity.value = localStorage.getItem("berrymote-sensitivity") || "1.2";
        sensitivity.addEventListener("input", () => {
            localStorage.setItem("berrymote-sensitivity", sensitivity.value);
        });

        async function sendAction(action, data = "") {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 4000);
            try {
                const response = await fetch("/action", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, data }),
                    signal: controller.signal
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                }
            } catch (error) {
                /* Keep the remote responsive even if a request fails. */
            } finally {
                clearTimeout(timeout);
            }
        }

        /*
         * Send text from input events so mobile virtual keyboards work too.
         * Soft keyboards often never fire cancelable keydown events.
         */
        let lastValue = "";
        let textQueue = Promise.resolve();

        function queueText(task) {
            textQueue = textQueue.then(task).catch(() => {});
        }

        catcher.focus();
        catcher.addEventListener("input", () => {
            const value = catcher.value;
            if (value === lastValue) {
                return;
            }
            const previous = lastValue;
            lastValue = value;
            if (value.startsWith(previous)) {
                const inserted = value.slice(previous.length);
                if (inserted) {
                    queueText(() => sendAction("type", inserted));
                }
            } else if (previous.startsWith(value)) {
                const removed = previous.length - value.length;
                if (removed > 0) {
                    queueText(() => sendAction("backspace", removed));
                }
            } else {
                queueText(async () => {
                    if (previous.length) {
                        await sendAction("backspace", previous.length);
                    }
                    if (value) {
                        await sendAction("type", value);
                    }
                });
            }
        });
        catcher.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                catcher.value = "";
                lastValue = "";
                queueText(() => sendAction("type", "\n"));
            } else if (event.key === "Tab") {
                event.preventDefault();
                queueText(() => sendAction("key", "tab"));
            } else if (event.key === "Escape") {
                event.preventDefault();
                queueText(() => sendAction("key", "esc"));
            }
        });

        document.addEventListener("click", (event) => {
            const button = event.target.closest("button");
            if (!button) {
                return;
            }
            if (button.dataset.click) {
                sendAfterMoves("click", button.dataset.click);
            } else if (button.dataset.scroll) {
                sendAfterMoves("scroll", { dy: Number(button.dataset.scroll) });
            } else if (button.dataset.action) {
                sendAction(button.dataset.action);
            }
        });

        /*
         * Coalesce trackpad movement and allow a few requests in flight.
         * Relative deltas are additive, so parallel requests still move the
         * pointer correctly while hiding network round-trip latency.
         */
        const MAX_MOVE_REQUESTS = 3;
        let pendingX = 0;
        let pendingY = 0;
        let movesInFlight = 0;
        const moveRequests = new Set();

        function queueMove(dx, dy) {
            const scale = parseFloat(sensitivity.value) || 1.2;
            pendingX += dx * scale;
            pendingY += dy * scale;
            flushMove();
        }

        function flushMove() {
            if (movesInFlight >= MAX_MOVE_REQUESTS) {
                return;
            }
            const dx = Math.trunc(pendingX);
            const dy = Math.trunc(pendingY);
            if (!dx && !dy) {
                return;
            }
            pendingX -= dx;
            pendingY -= dy;
            movesInFlight += 1;
            const request = sendAction("move", { dx, dy }).finally(() => {
                movesInFlight -= 1;
                moveRequests.delete(request);
                if (Math.abs(pendingX) >= 1 || Math.abs(pendingY) >= 1) {
                    flushMove();
                }
            });
            moveRequests.add(request);
        }

        async function sendAfterMoves(action, data = "") {
            if (moveRequests.size) {
                await Promise.race([
                    Promise.all([...moveRequests]),
                    new Promise((resolve) => setTimeout(resolve, 250))
                ]);
            }
            return sendAction(action, data);
        }

        let activePointer = null;
        let lastX = 0;
        let lastY = 0;
        let startX = 0;
        let startY = 0;
        let moved = false;
        let longPressed = false;
        let longPressTimer = null;

        function cancelLongPress() {
            if (longPressTimer !== null) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        trackpad.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            if (activePointer !== null) {
                return;
            }
            activePointer = event.pointerId;
            if (trackpad.setPointerCapture) {
                try {
                    trackpad.setPointerCapture(event.pointerId);
                } catch (error) {}
            }
            lastX = startX = event.clientX;
            lastY = startY = event.clientY;
            moved = false;
            longPressed = false;
            longPressTimer = setTimeout(() => {
                if (!moved) {
                    longPressed = true;
                    sendAfterMoves("click", "right");
                }
            }, 650);
        });

        trackpad.addEventListener("pointermove", (event) => {
            if (event.pointerId !== activePointer) {
                return;
            }
            event.preventDefault();
            const dx = event.clientX - lastX;
            const dy = event.clientY - lastY;
            if (Math.abs(event.clientX - startX) + Math.abs(event.clientY - startY) > 8) {
                moved = true;
                cancelLongPress();
            }
            if (dx || dy) {
                queueMove(dx, dy);
                lastX = event.clientX;
                lastY = event.clientY;
            }
        });

        function endPointer(event) {
            if (event.pointerId !== activePointer) {
                return;
            }
            cancelLongPress();
            if (!moved && !longPressed) {
                sendAfterMoves("click", "left");
            }
            activePointer = null;
        }

        trackpad.addEventListener("pointerup", endPointer);
        trackpad.addEventListener("pointercancel", endPointer);
        trackpad.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
</body>
</html>
